name: Validate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Validate
      run: pnpm run test
