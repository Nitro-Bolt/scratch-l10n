name: Sync Translations

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-translations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch-l10n
        uses: actions/checkout@v4
        with:
          path: scratch-l10n
          ref: develop
          token: ${{ secrets.AUTOMATION }}

      - name: Check out scratch-gui
        uses: actions/checkout@v4
        with:
          repository: Nitro-Bolt/scratch-gui
          path: scratch-gui
          ref: develop
          token: ${{ secrets.AUTOMATION }}

      - name: Check out scratch-vm
        uses: actions/checkout@v4
        with:
          repository: Nitro-Bolt/scratch-vm
          path: scratch-vm
          ref: develop
          token: ${{ secrets.AUTOMATION }}

      - name: Check out scratch-paint
        uses: actions/checkout@v4
        with:
          repository: Nitro-Bolt/scratch-paint
          path: scratch-paint
          ref: develop
          token: ${{ secrets.AUTOMATION }}

      - name: Check out scratch-blocks
        uses: actions/checkout@v4
        with:
          repository: Nitro-Bolt/scratch-blocks
          path: scratch-blocks
          ref: develop
          token: ${{ secrets.AUTOMATION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            scratch-l10n/pnpm-lock.yaml
            scratch-gui/pnpm-lock.yaml
            scratch-vm/pnpm-lock.yaml
            scratch-paint/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir scratch-l10n install --frozen-lockfile
          pnpm --dir scratch-gui install --frozen-lockfile
          pnpm --dir scratch-vm install --frozen-lockfile
          pnpm --dir scratch-paint install --frozen-lockfile

      - name: Update TurboWarp translation snapshot
        working-directory: scratch-l10n
        run: pnpm sync:upstream

      - name: Push source strings
        working-directory: scratch-l10n
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: pnpm transifex:push

      - name: Pull reviewed translations
        working-directory: scratch-l10n
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: pnpm transifex:pull

      - name: Validate translations
        working-directory: scratch-l10n
        run: pnpm test

      - name: Commit and push updates
        working-directory: scratch-l10n
        run: |
          if [ -z "$(git status --porcelain -- sources overrides turbowarp-translations.json)" ]; then
            echo "No translation updates."
            exit 0
          fi
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add sources overrides turbowarp-translations.json
          git commit -m "fix: update translations"
          git pull --rebase origin develop
          git push origin develop
